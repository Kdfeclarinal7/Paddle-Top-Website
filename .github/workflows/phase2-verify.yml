name: PADDLE TOP Phase 2 verification

on:
  push:
    branches:
      - feature/paddle-top-phase-2-auth

permissions:
  contents: write # Temporary: commit npm lockfile, then make checks read-only.

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: phase2-temporary
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Phase 1 and Phase 2 migrations to isolated Postgres
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat <<'SQL' | docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres
          create schema auth;
          create table auth.users (id uuid primary key);
          create function auth.uid()
          returns uuid language sql stable
          as 'select nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid';
          create role anon nologin;
          create role authenticated nologin;
          grant usage on schema auth to anon, authenticated;
          SQL
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/migrations/20261103160000_phase1_foundation.sql
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/migrations/20261104010000_phase2_auth_foundation.sql
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/phase1_assertions.sql
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/phase2_auth_assertions.sql

      - name: Generate npm lockfile for Supabase JS
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit npm lockfile on this feature branch
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock Supabase JS dependency for Phase 2"
            token_header="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w 0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
              push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify frontend TypeScript and build
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Check Phase 2 boundaries
        run: |
          ! grep -E 'createMockHold|createConfirmedMockBooking|MockPaymentModal' src/components/booking/BookingPage.tsx
          ! grep -E 'service_role|SUPABASE_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY' src/lib/supabase.ts src/context/AuthContext.tsx
